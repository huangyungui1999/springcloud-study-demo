server:
  port: 18888

spring:
  application:
    name: gateway-service
  cloud:
    nacos:
      #      discovery:
      #        server-addr: nacos-server:8848
      config:
        namespace: 390e134d-a75e-42ec-8ec7-2228e5db4622
        server-addr: nacos-server:8848
        file-extension: yml   #指定配置文件扩展名为yml

    gateway:
      #设置路由：路由id、路由到微服务的uri、断言
      routes:
        - id: order_route  #路由ID，全局唯一，建议配置服务名
          uri: lb://order-service  #lb 整合负载均衡器loadbalancer
          predicates:
            - Path=/order/**   # 断言，路径相匹配的进行路由

        - id: storage_route   #路由ID，全局唯一，建议配置服务名
          uri: lb://storage-service  #lb 整合负载均衡器loadbalancer
          predicates:
            - Path=/storage/**   # 断言，路径相匹配的进行路由

        - id: account_route   #路由ID，全局唯一，建议配置服务名
          uri: lb://account-service  #lb 整合负载均衡器loadbalancer
          predicates:
            - Path=/account/**   # 断言，路径相匹配的进行路由

  config:
    import:
      - optional:nacos:${spring.application.name}.yml
      - nacos:nacos-discovery.yml


