server:
  port: 8030

spring:
  application:
    name: order-service
  cloud:
    nacos:
      #      discovery:
      #        server-addr: nacos-server:8848
      config:
        server-addr: nacos-server:8848
        namespace: 390e134d-a75e-42ec-8ec7-2228e5db4622
        file-extension: yml   #指定配置文件扩展名为yml

  #    loadbalancer:
  #      nacos:
  #        enabled: true

  config:
    import:
      - optional:nacos:${spring.application.name}.yml
      - optional:nacos:db-common.yml    #数据库公共配置
      - optional:nacos:rabbitmq-common.yml
      - nacos:nacos-discovery.yml

  rabbitmq:
    host: # 请填写 RabbitMQ 地址，例如 localhost
    port: 5672
    username: # 请填写用户名
    password: # 请填写密码
    virtual-host: /

